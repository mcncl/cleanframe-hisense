services:
  cleanframe:
    build:
      context: ..
      dockerfile: hisense/Dockerfile
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${CLEANFRAME_PORT:-4795}:4795"
    environment:
      TV_HOST: ${TV_HOST:?Set the TV address}
      CLEANFRAME_BASE_URL: ${CLEANFRAME_BASE_URL:?Set the server URL}
      TZ: Australia/Melbourne
    volumes:
      - ${CLEANFRAME_DATA_DIR:-../.local/hisense/state}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4795/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
