name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEANFRAME_PUBLIC_FONTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r hisense/requirements.txt
      - run: npm run check
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - run: python -m unittest discover -s hisense -p 'test_*.py' -v
      - run: npm run check:hisense
        env:
          CLEANFRAME_PYTHON: python
